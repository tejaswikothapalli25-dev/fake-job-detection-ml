<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #07152f, #123b70);
            padding: 20px;
        }

        .box {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,.3);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg,#1e90ff,#00c6ff);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 23px;
        }

        h1 {
            text-align: center;
            color: #102b56;
            margin-top: 15px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1e90ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1478d4;
        }

        .error {
            background: #ffe5e5;
            color: #c0392b;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }

        .link a {
            color: #1e75d9;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="logo">FJ</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Enter your registered details
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Registered email"
            required
        >

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            required
        >

        <label>Confirm New Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <div class="link">

        <a href="/">
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
